    <!-- ═══════════ حاوية الخريطة (ملء الشاشة — 150vmax لاستيعاب الدوران) ═══════════ -->
    <div id="map" class="map-canvas"></div>

    <!-- ═══════════ الترويسة: شريط بحث كامل العرض (شعار + بحث + بوصلة) ═══════════ -->
    <!-- تدرّجات داكنة ناعمة أعلى/أسفل الشاشة لتتضح العناصر فوق صورة الأقمار الصناعية -->
    <div class="scrim scrim-top" aria-hidden="true"></div>
    <div class="scrim scrim-bottom" aria-hidden="true"></div>

    <!-- ═══════════ الترويسة: كبسولة زجاجية واحدة (بحث + مشاركة + بوصلة) ═══════════ -->
    <header class="pointer-events-none absolute inset-x-0 top-0 z-[1200] logo-top px-4">
      <div id="searchWrap" class="pointer-events-auto search-wrap top-search min-w-0 w-full">
        <span class="search-icon" aria-hidden="true"><svg class="i " aria-hidden="true"><use href="#i-search"/></svg></span>
        <input
          id="coordInput"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder="إلى أين؟"
          aria-label="ابحث عن مكان أو إحداثيات"
          class="search-input"
        />
        <button id="coordClearBtn" class="search-act hidden" type="button" aria-label="مسح البحث" title="مسح البحث"><svg class="i " aria-hidden="true"><use href="#i-x"/></svg></button>
        <button id="coordShareBtn" class="search-act" type="button" aria-label="مشاركة موقعي" title="مشاركة موقعي"><svg class="i " aria-hidden="true"><use href="#i-share-2"/></svg></button>

        <!-- البوصلة التفاعلية (تدور مع الخريطة — اضغط للشمال) -->
        <button
          id="compassBtn"
          class="compass-btn compass-mini"
          type="button"
          aria-label="البوصلة — الشمال للأعلى"
          title="الشمال للأعلى — اضغط لوضع اتجاه السير"
        >
          <svg id="compassNeedle" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="cmp-ring" cx="24" cy="24" r="21" />
            <path class="cmp-n" d="M24 6.5 L28.6 24 L24 20.8 L19.4 24 Z" />
            <path class="cmp-s" d="M24 41.5 L19.4 24 L24 27.2 L28.6 24 Z" />
            <circle class="cmp-c" cx="24" cy="24" r="3" />
          </svg>
        </button>
      </div>
    </header>

    <!-- نتائج البحث (تنسدل تحت الترويسة) -->
    <div id="searchResults" class="search-results top-results hidden"></div>
    <p id="coordHint" class="coord-hint hidden rounded-lg bg-red-950/80 px-3 py-1 text-[11px] font-semibold text-red-200"></p>

    <!-- ═══════════ شريط العدادات: زجاج واحد مضغوط (سرعة | مسافة | مدة) ═══════════ -->
    <div class="pointer-events-none hud-top absolute inset-x-0 z-[1000] flex justify-center px-4">
      <div class="pointer-events-auto hud-bar" role="group" aria-label="عدادات الرحلة">
        <div class="hud-cell hud-cell-speed">
          <span class="hud-label">السرعة <span id="gpsDot" class="gps-dot" title="دقة GPS" aria-label="دقة GPS"></span></span>
          <span id="hudSpeed" class="hud-value hud-speed">0</span>
          <span class="hud-unit">كم/س</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">المسافة</span>
          <span id="hudDistance" class="hud-value">0.00</span>
          <span class="hud-unit">كم</span>
        </div>
        <div class="hud-cell">
          <span class="hud-label">المدة</span>
          <span id="hudDuration" class="hud-value hud-duration">00:00:00</span>
          <span class="hud-unit">&nbsp;</span>
        </div>
      </div>
    </div>

    <!-- ═══════════ رسالة خطأ GPS ═══════════ -->
    <div
      id="gpsError"
      class="absolute inset-x-0 top-[14rem] z-[1000] hidden justify-center px-4"
    >
      <p
        class="rounded-xl border border-red-500/40 bg-red-950/80 px-3 py-2 text-xs font-semibold text-red-200 shadow-lg backdrop-blur-md"
      ></p>
    </div>

    <!-- ═══════════ شريط الهدف (وضع الملاحة البرية) ═══════════ -->
    <div
      id="targetHud"
      class="absolute inset-x-0 top-[9.5rem] z-[1500] hidden justify-center px-4"
    >
      <div class="nav-hud">
        <span class="nav-hud-icon" aria-hidden="true">🧭</span>
        <div class="min-w-0 flex-1">
          <p id="targetName" class="nav-hud-name"></p>
          <p class="nav-hud-meta">
            <span id="targetDist" class="nav-hud-dist"></span>
            <span id="targetBearing" class="nav-hud-brg"></span>
          </p>
        </div>
        <button id="routeBtn" class="nav-hud-x route-btn" type="button" aria-label="احسب طريق سيارة (داخل المدن)" title="طريق سيارة — داخل المدن">🛣️</button>
        <button
          id="clearTargetBtn"
          class="nav-hud-x"
          type="button"
          aria-label="إنهاء الملاحة"
          title="إنهاء الملاحة"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- ═══════════ شريط ملاحة المسار المحفوظ ═══════════ -->
    <div
      id="followHud"
      class="absolute inset-x-0 top-[9.5rem] z-[1500] justify-center px-4"
    >
      <div class="nav-hud follow-hud">
        <span id="followIcon" class="nav-hud-icon" aria-hidden="true">🧭</span>
        <div class="min-w-0 flex-1">
          <p id="followName" class="nav-hud-name"></p>
          <p id="followStatus" class="nav-hud-meta"></p>
          <p id="followTurn" class="follow-turn hidden"></p>
        </div>
        <button id="followVoiceBtn" class="nav-hud-x hidden" type="button" aria-label="الصوت" title="تشغيل/كتم التعليمات الصوتية">🔊</button>
        <button id="followReverseBtn" class="nav-hud-x" type="button" aria-label="عكس الاتجاه" title="عكس الاتجاه">↔</button>
        <button id="followStopBtn" class="nav-hud-x" type="button" aria-label="إنهاء ملاحة المسار" title="إنهاء">✕</button>
      </div>
    </div>

    <!-- ═══════════ مودال إضافة نقطة POI ═══════════ -->
    <div
      id="poiModal"
      class="absolute inset-0 z-[2000] hidden items-center justify-center bg-black/60 px-4 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-[#0d1526] p-5 shadow-2xl shadow-black/60"
      >
        <h2 class="text-lg font-bold text-white">📌 إضافة نقطة</h2>
        <p class="mt-1 text-xs text-slate-400">اضغط مطولاً على الخريطة أو زر أيمن لإضافة نقطة</p>
        <div id="poiTypeGrid" class="mt-3 grid grid-cols-2 gap-2">
          <button class="poi-type" data-type="camp" type="button">⛺ مخيم</button>
          <button class="poi-type" data-type="water" type="button">💧 ماء/بئر</button>
          <button class="poi-type" data-type="danger" type="button">⚠️ خطر/وعر</button>
          <button class="poi-type" data-type="landmark" type="button">📍 معلم</button>
        </div>
        <input id="poiName" class="modal-input mt-3" type="text" placeholder="اسم النقطة (اختياري)" maxlength="60" />
        <input id="poiNote" class="modal-input mt-2" type="text" placeholder="ملاحظة (اختياري)" maxlength="120" />
        <div class="mt-4 flex gap-3">
          <button id="poiSaveBtn" class="btn-primary" type="button">حفظ النقطة</button>
          <button id="poiCancelBtn" class="btn-ghost" type="button">إلغاء</button>
        </div>
      </div>
    </div>

    <!-- ═══════════ زر التسجيل: كبسولة بلون الهوية، وأثناء التسجيل زجاج + إيقاف مؤقت ═══════════ -->
    <div class="rec-dock absolute inset-x-0 z-[1000] flex justify-center px-4">
      <div class="rec-group">
        <button id="recordBtn" class="record-btn" type="button" aria-label="بدء الرحلة أو إيقافها">
          <span id="recordDot" class="record-dot" aria-hidden="true"></span>
          <span id="recordLabel">ابدأ الرحلة</span>
        </button>
        <button id="pauseBtn" class="pause-btn hidden" type="button" aria-label="إيقاف مؤقت" title="إيقاف مؤقت">
          <span class="pause-ic ic-pause"><svg class="i " aria-hidden="true"><use href="#i-pause"/></svg></span>
          <span class="pause-ic ic-play"><svg class="i " aria-hidden="true"><use href="#i-play"/></svg></span>
        </button>
      </div>
    </div>

    <!-- ═══════════ بطاقة النقطة الثابتة (Bottom Sheet — لا تدور مع الخريطة) ═══════════
         خارج حاوية الخريطة تماماً: تبقى أفقية في كل زوايا الدوران.
         تُستخدم للدبوس المؤقت ونقاط POI ونتائج البحث -->
    <div id="pinSheet" class="pin-sheet hidden" role="dialog" aria-label="النقطة" aria-live="polite">
      <button id="pinSheetX" class="pin-sheet-x" type="button" aria-label="إغلاق" title="إغلاق">✕</button>
      <div class="pin-sheet-row">
        <span id="pinSheetIcon" class="pin-sheet-icon" aria-hidden="true">📍</span>
        <div class="pin-sheet-info">
          <p id="pinSheetTitle" class="pin-sheet-title"></p>
          <p id="pinSheetSub" class="pin-sheet-sub hidden"></p>
          <p id="pinSheetDms" class="pin-sheet-coord"></p>
          <p id="pinSheetDd" class="pin-sheet-coord pin-sheet-dd"></p>
        </div>
      </div>
      <div id="pinSheetActions" class="pin-sheet-actions"></div>
    </div>

    <!-- ═══════════ لوحة تبديل الطبقات (Bottom Sheet) ═══════════ -->
    <div
      id="layerPanel"
      class="layer-sheet"
    >
      <div class="layer-sheet-handle" aria-hidden="true"></div>
      <p class="px-3 pb-1 pt-1 text-xs font-bold text-slate-400">الطبقة الأساسية</p>

      <label class="layer-option" data-layer="satellite">
        <input type="radio" name="baseLayer" value="satellite" checked class="sr-only" />
        <span class="option-icon">🛰️</span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-white">قمر صناعي</span>
          <span class="block text-[11px] text-slate-400">صورة حقيقية عالية الدقة</span>
        </span>
        <span class="option-check">✓</span>
      </label>

      <label class="layer-option" data-layer="hybrid">
        <input type="radio" name="baseLayer" value="hybrid" class="sr-only" />
        <span class="option-icon">🧭</span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-white">هجين</span>
          <span class="block text-[11px] text-slate-400">قمر صناعي + أسماء المدن والشوارع</span>
        </span>
        <span class="option-check">✓</span>
      </label>

      <label class="layer-option" data-layer="streets">
        <input type="radio" name="baseLayer" value="streets" class="sr-only" />
        <span class="option-icon">🏙️</span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-white">شوارع</span>
          <span class="block text-[11px] text-slate-400">خريطة OSM — أسماء عربية واضحة</span>
        </span>
        <span class="option-check">✓</span>
      </label>

      <label class="layer-option" data-layer="terrain">
        <input type="radio" name="baseLayer" value="terrain" class="sr-only" />
        <span class="option-icon">⛰️</span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-white">تضاريس</span>
          <span class="block text-[11px] text-slate-400">كنتور وارتفاعات ومناهل</span>
        </span>
        <span class="option-check">✓</span>
      </label>

      <label class="layer-option" data-layer="night">
        <input type="radio" name="baseLayer" value="night" class="sr-only" />
        <span class="option-icon">🌙</span>
        <span class="flex-1">
          <span class="block text-sm font-semibold text-white">ليلي</span>
          <span class="block text-[11px] text-slate-400">وضع داكن — طريق سريع</span>
        </span>
        <span class="option-check">✓</span>
      </label>

      <!-- طبقة النقاط -->
      <label class="poi-layer-toggle" for="poisToggle">
        <input type="checkbox" id="poisToggle" checked class="sr-only" />
        <span class="text-base">🌿</span>
        <span class="flex-1 text-sm font-semibold text-white">نقاط البر — رياض · آبار · مخيمات</span>
        <span class="switch"><span class="track"></span></span>
      </label>

      <!-- تحميل المنطقة للأوفلاين -->
      <div class="offline-row">
        <button id="offlineBtn" class="offline-btn" type="button">
          <span id="offlineLabel">📥 تحميل المنطقة الظاهرة للأوفلاين</span>
          <span class="offline-progress hidden"><span id="offlineBar"></span></span>
        </button>
        <button id="offlineClear" class="offline-clear" type="button" aria-label="حذف الخرائط المحملة" title="حذف الخرائط المحملة">🗑️</button>
      </div>
      <p id="offlineSize" class="px-3 pt-1 text-[11px] text-slate-500"></p>
    </div>

    <!-- ═══════════ مودال حفظ المسار ═══════════ -->
    <div
      id="saveModal"
      class="absolute inset-0 z-[2000] hidden items-center justify-center bg-black/60 px-4 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-[#0d1526] p-5 shadow-2xl shadow-black/60"
      >
        <h2 class="text-lg font-bold text-white">💾 حفظ المسار</h2>
        <p id="saveModalStats" class="mt-1 text-xs text-slate-400"></p>

        <label for="trackName" class="mt-4 block text-sm font-semibold text-slate-300">
          اسم المسار
        </label>
        <input
          id="trackName"
          type="text"
          placeholder="مثال: درب النفود"
          maxlength="60"
          class="modal-input mt-1.5"
        />

        <label for="trackNotes" class="mt-3 block text-sm font-semibold text-slate-300">
          ملاحظات <span class="text-slate-500">(اختياري)</span>
        </label>
        <textarea
          id="trackNotes"
          placeholder="مثال: رملي سهل، ينفع للمركبات الدفع الرباعي"
          rows="2"
          maxlength="200"
          class="modal-input mt-1.5 resize-none"
        ></textarea>

        <div class="mt-5 flex gap-3">
          <button id="saveTrackBtn" class="btn-primary" type="button">حفظ المسار</button>
          <button id="discardTrackBtn" class="btn-ghost" type="button">تجاهل</button>
        </div>
      </div>
    </div>

    <!-- ═══════════ مودال المشاركة ═══════════ -->
    <div
      id="shareModal"
      class="absolute inset-0 z-[2000] hidden items-center justify-center bg-black/60 px-4 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-[#0d1526] p-5 shadow-2xl shadow-black/60"
      >
        <h2 class="text-lg font-bold text-white">📤 مشاركة المسار</h2>
        <p id="shareModalName" class="mt-1 truncate text-sm font-semibold text-cyan-300"></p>
        <div class="mt-5 flex flex-col gap-3">
          <button id="copyLinkBtn" class="btn-primary" type="button">
            🔗 نسخ رابط المشاركة
          </button>
          <button id="downloadGpxBtn" class="btn-ghost w-full" type="button">
            ⬇️ تحميل ملف GPX
          </button>
          <button id="closeShareBtn" class="btn-ghost w-full" type="button">إلغاء</button>
        </div>
      </div>
    </div>

    <!-- ═══════════ بانر المسار المستورد من الرابط ═══════════ -->
    <div
      id="importBanner"
      class="absolute inset-x-0 bottom-[max(5.5rem,calc(env(safe-area-inset-bottom)+4.5rem))] z-[1500] hidden justify-center px-4"
    >
      <div
        class="flex max-w-md items-center gap-3 rounded-2xl border border-cyan-400/30 bg-[#0d1526]/95 px-4 py-3 shadow-2xl shadow-black/50 backdrop-blur-md"
      >
        <span class="text-xl">🧭</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-bold text-white" id="importName"></p>
          <p class="text-[11px] text-slate-400" id="importMeta"></p>
        </div>
        <button id="importSaveBtn" class="btn-primary !min-h-[44px] !rounded-xl px-4 !text-sm" type="button">
          💾 حفظ
        </button>
        <button id="importCloseBtn" class="track-action" type="button" aria-label="إغلاق">✖️</button>
      </div>
    </div>

    <!-- ═══════════ لوحة المسارات المحفوظة ═══════════ -->
    <div
      id="tracksPanel"
      class="absolute bottom-24 right-4 z-[1000] flex max-h-[60vh] w-72 flex-col rounded-2xl border border-white/10 bg-[#0d1526]/95 shadow-2xl shadow-black/60 backdrop-blur-md"
    >
      <div class="flex items-center justify-between px-4 pb-1 pt-3">
        <p class="text-xs font-bold text-slate-400">المسارات المحفوظة</p>
        <div class="flex items-center gap-2">
          <span id="tracksCount" class="text-[11px] text-slate-500"></span>
          <button id="importGpxBtn" class="gpx-btn" type="button" aria-label="استيراد ملف GPX">
            ⬆️ GPX
          </button>
        </div>
      </div>
      <input id="gpxFileInput" type="file" accept=".gpx,.xml,application/gpx+xml" class="hidden" />
      <div id="tracksList" class="max-h-[48vh] flex-1 overflow-y-auto px-2 pb-2"></div>
    </div>

    <!-- ═══════════ مجموعة زجاجية جانبية واحدة (خرائط · مسارات · مركبة · موقعي) ═══════════ -->
    <nav class="toolbar-dock dock absolute left-4 z-[1000] flex flex-col" aria-label="الأدوات">
      <button id="layersBtn" class="fab" type="button" aria-label="الخرائط" title="الخرائط" aria-expanded="false">
        <svg class="i " aria-hidden="true"><use href="#i-layers"/></svg><span class="dock-label">الخرائط</span>
      </button>
      <button id="tracksBtn" class="fab" type="button" aria-label="المسارات المحفوظة" title="المسارات" aria-expanded="false">
        <svg class="i " aria-hidden="true"><use href="#i-route"/></svg><span class="dock-label">المسارات</span>
      </button>
      <button id="carBtn" class="fab" type="button" aria-label="موقع المركبة" title="المركبة">
        <svg class="i " aria-hidden="true"><use href="#i-car"/></svg><span class="dock-label">المركبة</span>
      </button>
      <button id="locateBtn" class="fab" type="button" aria-label="موقعي — إعادة التمركز" title="موقعي">
        <svg class="i " aria-hidden="true"><use href="#i-locate-fixed"/></svg><span class="dock-label">موقعي</span>
      </button>
    </nav>

    <!-- Leaflet JS -->
    <script src="vendor/leaflet/leaflet.js"></script>
    <!-- أدوات الحساب -->
    <script src="utils.js"></script>
    <!-- منطق التطبيق -->
    <script src="app.js"></script>
    <!-- محرك التتبع GPS -->
    <script src="tracker.js"></script>
    <!-- محرك التخزين المحلي -->
    <script src="storage.js"></script>
    <!-- واجهة إدارة المسارات -->
    <script src="tracks.js"></script>
    <!-- المشاركة والتصدير (GPX + رابط) -->
    <script src="share.js"></script>
    <!-- نظام نقاط الاهتمام -->
    <script src="pois.js"></script>
    <!-- ناقل التوجيه والإحداثيات الذكية -->
    <script src="nav.js"></script>
    <!-- دوران الخريطة + البوصلة -->
    <script src="compass.js"></script>
    <!-- تحميل المناطق للأوفلاين -->
    <script src="offline.js"></script>
    <!-- موقع السيارة + العودة للبداية -->
    <script src="car.js"></script>
    <!-- ملاحة المسار المحفوظ + تنبيه الابتعاد -->
    <script src="follow.js"></script>
    <!-- توجيه الطرق داخل المدن (اختياري) -->
    <script src="route.js"></script>
    <!-- وضع القيادة: تتبع المؤشر + زوم تلقائي -->
    <script src="drive.js"></script>
    <!-- تسجيل عامل الخدمة (الأوفلاين) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
